name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: install browsers
        timeout-minutes: 10
        run: npx playwright install chromium webkit
      - name: quality gate (syntax, secrets, comments, tests-present, vitest, e2e)
        run: npm run quality
      - name: keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-node${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
